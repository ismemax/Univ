<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Content Security Policy: Hardened for Institutional Use -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https:; frame-ancestors 'none'; form-action 'self';">
  <title>UMak Academic Questionnaire System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            umak: {
              blue: '#28336B', // Space Cadet (Primary)
              navy: '#060E33', // Space Cadet (Dark)
              yellow: '#FDB813', // Maximum Yellow / Gold
              silver: '#C0D5F0', // Silver Lake Blue
            }
          },
          fontFamily: {
            serif: ['Marcellus', 'serif'],
            sans: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #ffffff;
    }

    .font-marcellus {
      font-family: 'Marcellus', serif;
    }

    .umak-blue {
      color: #004A98;
    }

    .bg-umak-blue {
      background-color: #004A98;
    }

    .border-umak-blue {
      border-color: #004A98;
    }

    .umak-yellow {
      color: #FDB813;
    }

    .bg-umak-yellow {
      background-color: #FDB813;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
